[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-memory-agent"
version = "0.1.0"
description = "A seven-memory research agent backed by Oracle Vector Search"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Shehroz Ali"}]
dependencies = [
  "openai>=1.60,<3",
  "oracledb>=2.5,<4",
  "sentence-transformers>=3,<6",
  "pypdf>=5,<7",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
research-agent = "research_memory_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
